<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mavis Memory Wiki</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --accent-hover: #79c0ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-hover); text-decoration: none; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 { font-size: 20px; font-weight: 600; }
  header h1 span { color: var(--accent); }
  header nav a {
    margin-left: 20px;
    font-size: 14px;
    color: var(--text-dim);
  }
  header nav a:hover, header nav a.active { color: var(--text); text-decoration: none; }

  .search-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    color: var(--text);
    font-size: 14px;
    width: 240px;
  }
  .search-box:focus { outline: none; border-color: var(--accent); }

  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .page { display: none; }
  .page.active { display: block; }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: var(--accent); }
  .card h3 { font-size: 16px; margin-bottom: 6px; }
  .card h3 .category {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 12px;
    background: rgba(88,166,255,0.15);
    color: var(--accent);
    margin-left: 8px;
    vertical-align: middle;
  }
  .card h3 .status {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 12px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .card h3 .status.active { background: rgba(63,185,80,0.15); color: var(--green); }
  .card h3 .status.paused { background: rgba(210,153,34,0.15); color: var(--yellow); }
  .card h3 .status.done { background: rgba(139,148,158,0.15); color: var(--text-dim); }
  .card p { font-size: 13px; color: var(--text-dim); }
  .card .tags { margin-top: 10px; }
  .card .tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(188,140,255,0.15);
    color: var(--purple);
    margin-right: 6px;
  }
  .card .date { font-size: 12px; color: var(--text-dim); margin-top: 8px; }
  .card .url { font-size: 12px; margin-top: 6px; }
  .card-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .mini-btn {
    background: rgba(13,17,23,0.70);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .mini-btn:hover { border-color: var(--accent); color: var(--text); }
  .mini-btn.danger:hover { border-color: var(--red); color: var(--red); }
  .project-toolbar { margin: 0 0 12px; display: flex; gap: 8px; flex-wrap: wrap; }

  /* Inline trade action buttons */
  .trade-action-btn {
    background: rgba(63,185,80,0.15);
    border: 1px solid var(--green);
    color: var(--green);
    padding: 2px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    white-space: nowrap;
  }
  .trade-action-btn:hover { background: rgba(63,185,80,0.30); }
  .trade-action-btn.close-btn {
    background: rgba(248,81,73,0.10);
    border-color: var(--red);
    color: var(--red);
  }
  .trade-action-btn.close-btn:hover { background: rgba(248,81,73,0.25); }
  .trade-edit-input {
    background: var(--bg);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 3px 6px;
    border-radius: 4px;
    font-size: 12px;
    width: 80px;
    font-family: inherit;
  }
  .trade-edit-input:focus { outline: none; }
  .trade-edit-row {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }
  .trade-override-reset {
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
    margin-left: 8px;
  }
  .trade-override-reset:hover { color: var(--red); }

  /* Detail view */
  .detail-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .back-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .back-btn:hover { border-color: var(--accent); }
  .detail-title { font-size: 24px; font-weight: 600; }
  .detail-meta { font-size: 13px; color: var(--text-dim); margin-top: 4px; }

  .entry {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .entry h4 { font-size: 15px; margin-bottom: 4px; }
  .entry .entry-date { font-size: 12px; color: var(--yellow); margin-bottom: 12px; }
  .entry ul { padding-left: 20px; }
  .entry li { font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }

  .log-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .log-card:hover { border-color: var(--accent); }
  .log-card .log-date { font-size: 12px; color: var(--green); font-weight: 600; }
  .log-card h3 { font-size: 16px; margin: 6px 0; }
  .log-card p { font-size: 13px; color: var(--text-dim); }
  .log-card .highlights { margin-top: 12px; }
  .log-card .highlights li {
    font-size: 12px; color: var(--text-dim); margin-bottom: 4px;
    padding-left: 16px; position: relative; list-style: none;
  }
  .log-card .highlights li::before {
    content: "→"; position: absolute; left: 0; color: var(--accent);
  }

  /* Project section on subject detail */
  .project-badge {
    display: inline-block;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 12px;
    background: rgba(63,185,80,0.15);
    color: var(--green);
    margin-bottom: 16px;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    text-align: center;
  }
  .stat-card .number { font-size: 32px; font-weight: 700; color: var(--accent); }
  .stat-card .label { font-size: 13px; color: var(--text-dim); margin-top: 4px; }

  .section-header {
    font-size: 18px;
    font-weight: 600;
    margin: 32px 0 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .dashboard {
    background: linear-gradient(180deg, rgba(88,166,255,0.10), rgba(22,27,34,1));
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .dashboard h3 { font-size: 18px; margin-bottom: 4px; }
  .dashboard .subtle { color: var(--text-dim); font-size: 12px; margin-bottom: 16px; }
  .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .dash-tile { background: rgba(13,17,23,0.70); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .dash-tile .label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .dash-tile .value { font-size: 18px; font-weight: 700; margin-top: 4px; }
  .dash-tile .small { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .positive { color: var(--green); }
  .negative { color: var(--red); }
  .neutral { color: var(--text-dim); }
  .asset-table { width: 100%; border-collapse: collapse; font-size: 12px; overflow-x: auto; display: block; }
  .asset-table th, .asset-table td { border-bottom: 1px solid var(--border); padding: 8px 10px; text-align: right; white-space: nowrap; }
  .asset-table th:first-child, .asset-table td:first-child { text-align: left; }
  .asset-table th { color: var(--text-dim); font-weight: 600; }
  .note-list { margin-top: 14px; padding-left: 18px; }
  .note-list li { color: var(--text-dim); font-size: 12px; margin-bottom: 4px; }

  footer {
    text-align: center;
    padding: 32px;
    color: var(--text-dim);
    font-size: 12px;
    border-top: 1px solid var(--border);
    margin-top: 48px;
  }

  @media (max-width: 600px) {
    header { flex-direction: column; gap: 12px; }
    .search-box { width: 100%; }
    .stats { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>🧠 <span>Mavis</span> Memory Wiki</h1>
  <nav>
    <a href="#" class="active" data-page="home">Home</a>
    <a href="#" data-page="projects">Projects</a>
    <a href="#" data-page="subjects">Subjects</a>
    <a href="#" data-page="logs">Daily Logs</a>
  </nav>
  <input type="text" class="search-box" placeholder="Search..." id="searchBox">
</header>

<div class="container">

  <!-- HOME -->
  <div class="page active" id="page-home">
    <div class="stats" id="stats"></div>

    <h2 class="section-header">Active Projects</h2>
    <div id="homeProjects"></div>

    <h2 class="section-header">Recent Activity</h2>
    <div id="recentLogs"></div>

    <h2 class="section-header">All Subjects</h2>
    <div id="allSubjects"></div>
  </div>

  <!-- PROJECTS -->
  <div class="page" id="page-projects">
    <h2 class="section-header">Projects</h2>
    <div id="projectsList"></div>
  </div>

  <!-- SUBJECTS -->
  <div class="page" id="page-subjects">
    <h2 class="section-header">All Subjects</h2>
    <div id="subjectsList"></div>
  </div>

  <!-- DAILY LOGS -->
  <div class="page" id="page-logs">
    <h2 class="section-header">Daily Logs</h2>
    <div id="logsList"></div>
  </div>

  <!-- PROJECT DETAIL -->
  <div class="page" id="page-project-detail">
    <div class="detail-header">
      <button class="back-btn" onclick="showPage('projects')">← Back</button>
      <div>
        <div class="detail-title" id="projectDetailTitle"></div>
        <div class="detail-meta" id="projectDetailMeta"></div>
      </div>
    </div>
    <div id="projectDetailEntries"></div>
    <h2 class="section-header" id="projectSubjectsHeader">Related Subjects</h2>
    <div id="projectDetailSubjects"></div>
  </div>

  <!-- SUBJECT DETAIL -->
  <div class="page" id="page-subject-detail">
    <div class="detail-header">
      <button class="back-btn" onclick="goBackSubject()">← Back</button>
      <div>
        <div class="detail-title" id="subjectDetailTitle"></div>
        <div class="detail-meta" id="subjectDetailMeta"></div>
      </div>
    </div>
    <div id="subjectDetailProjectLink"></div>
    <div id="subjectDetailEntries"></div>
  </div>

  <!-- LOG DETAIL -->
  <div class="page" id="page-log-detail">
    <div class="detail-header">
      <button class="back-btn" onclick="showPage('logs')">← Back</button>
      <div>
        <div class="detail-title" id="logDetailTitle"></div>
        <div class="detail-meta" id="logDetailMeta"></div>
      </div>
    </div>
    <div id="logDetailProjects"></div>
    <div id="logDetailEntries"></div>
  </div>

</div>

<footer>
  Mavis Memory Wiki · Last updated <span id="lastUpdated"></span> · Built with ❤️ by Mavis & Damon
</footer>

<script>
let DATA = null;
let prevPage = 'subjects';
let TRADE_FILTER = 'all';

fetch('data.json')
  .then(r => r.json())
  .then(d => {
    DATA = d;
    render();
  });

function render() {
  if (!DATA) return;
  document.getElementById('lastUpdated').textContent = DATA.meta.lastUpdated;

  const visibleProjects = getVisibleProjects();
  const totalEntries = DATA.subjects.reduce((a,s) => a + s.entries.length, 0) + visibleProjects.reduce((a,p) => a + p.entries.length, 0);

  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="number">${visibleProjects.length}</div><div class="label">Visible Projects</div></div>
    <div class="stat-card"><div class="number">${DATA.subjects.length}</div><div class="label">Subjects</div></div>
    <div class="stat-card"><div class="number">${DATA.dailyLogs.length}</div><div class="label">Daily Logs</div></div>
    <div class="stat-card"><div class="number">${totalEntries}</div><div class="label">Visible Entries</div></div>
  `;

  // Home projects
  document.getElementById('homeProjects').innerHTML = projectToolbarHtml() + visibleProjects.map(p => projectCard(p)).join('');

  // Recent logs
  document.getElementById('recentLogs').innerHTML = DATA.dailyLogs.slice(0, 3).map(log => logCard(log)).join('');

  // All subjects on home (non-project ones first, then project-linked)
  document.getElementById('allSubjects').innerHTML = DATA.subjects.map(s => subjectCard(s)).join('');

  // Projects page
  document.getElementById('projectsList').innerHTML = projectToolbarHtml() + visibleProjects.map(p => projectCard(p)).join('');

  // Subjects page
  document.getElementById('subjectsList').innerHTML = DATA.subjects.map(s => subjectCard(s)).join('');

  // Logs page
  document.getElementById('logsList').innerHTML = DATA.dailyLogs.map(log => logCard(log)).join('');
}

function projectCard(p) {
  return `
    <div class="card" onclick="showProjectDetail('${p.id}')">
      <h3>${p.name}<span class="status ${p.status}">${p.status}</span></h3>
      <p>${p.summary}</p>
      ${p.url ? `<div class="url">🌐 ${p.url}</div>` : ''}
      <div class="tags">${p.tags.map(t => `<span class="tag">#${t}</span>`).join('')}</div>
      <div class="date">${p.entries.length} entr${p.entries.length === 1 ? 'y' : 'ies'} · ${p.subjectIds.length} related subject${p.subjectIds.length === 1 ? '' : 's'}</div>
      <div class="card-actions">
        <button class="mini-btn" onclick="event.stopPropagation(); hideProject('${p.id}')">Hide</button>
        <button class="mini-btn danger" onclick="event.stopPropagation(); deleteProject('${p.id}')">Delete</button>
      </div>
    </div>
  `;
}

function projectPrefs() {
  const hidden = JSON.parse(localStorage.getItem('mavisHiddenProjects') || '[]');
  const deleted = JSON.parse(localStorage.getItem('mavisDeletedProjects') || '[]');
  return { hidden: new Set(hidden), deleted: new Set(deleted) };
}

function saveProjectPrefs(hidden, deleted) {
  localStorage.setItem('mavisHiddenProjects', JSON.stringify([...hidden]));
  localStorage.setItem('mavisDeletedProjects', JSON.stringify([...deleted]));
}

function getVisibleProjects() {
  const { hidden, deleted } = projectPrefs();
  return DATA.projects.filter(p => !hidden.has(p.id) && !deleted.has(p.id));
}

function projectToolbarHtml() {
  const { hidden, deleted } = projectPrefs();
  const hiddenCount = hidden.size;
  const deletedCount = deleted.size;
  if (!hiddenCount && !deletedCount) return '';
  return `<div class="project-toolbar">
    <button class="mini-btn" onclick="restoreProjects('hidden')">Show hidden (${hiddenCount})</button>
    <button class="mini-btn" onclick="restoreProjects('deleted')">Restore deleted (${deletedCount})</button>
    <button class="mini-btn" onclick="restoreProjects('all')">Reset project visibility</button>
  </div>`;
}

function hideProject(id) {
  const { hidden, deleted } = projectPrefs();
  if (!deleted.has(id)) hidden.add(id);
  saveProjectPrefs(hidden, deleted);
  render();
}

function deleteProject(id) {
  if (!confirm('Delete this project from your local view? This hides it on this device only.')) return;
  const { hidden, deleted } = projectPrefs();
  hidden.delete(id);
  deleted.add(id);
  saveProjectPrefs(hidden, deleted);
  render();
}

function restoreProjects(which) {
  const { hidden, deleted } = projectPrefs();
  if (which === 'hidden' || which === 'all') hidden.clear();
  if (which === 'deleted' || which === 'all') deleted.clear();
  saveProjectPrefs(hidden, deleted);
  render();
}

function subjectCard(s) {
  const projectBadge = s.projectId ? `<span class="category" style="background:rgba(63,185,80,0.15);color:var(--green)">📁 ${DATA.projects.find(p => p.id === s.projectId)?.name || s.projectId}</span>` : '';
  return `
    <div class="card" onclick="showSubjectDetail('${s.id}')">
      <h3>${s.name}<span class="category">${s.category}</span>${projectBadge}</h3>
      <p>${s.summary}</p>
      <div class="tags">${s.tags.map(t => `<span class="tag">#${t}</span>`).join('')}</div>
      <div class="date">${s.entries.length} entr${s.entries.length === 1 ? 'y' : 'ies'} · Last: ${s.entries.length ? s.entries[s.entries.length-1].date : '—'}</div>
    </div>
  `;
}

function logCard(log) {
  const projectBadges = (log.projects || []).map(pid => {
    const p = DATA.projects.find(x => x.id === pid);
    return p ? `<span class="category" style="background:rgba(63,185,80,0.15);color:var(--green);margin-left:6px;">📁 ${p.name}</span>` : '';
  }).join('');
  return `
    <div class="log-card" onclick="showLogDetail('${log.date}')">
      <div class="log-date">${formatDate(log.date)}</div>
      <h3>${log.title}${projectBadges}</h3>
      <p>${log.summary}</p>
      <ul class="highlights">${log.highlights.map(h => `<li>${h}</li>`).join('')}</ul>
    </div>
  `;
}

function showProjectDetail(id) {
  const p = DATA.projects.find(x => x.id === id);
  if (!p) return;
  document.getElementById('projectDetailTitle').innerHTML = `${p.name} <span class="status ${p.status}">${p.status}</span>`;
  document.getElementById('projectDetailMeta').textContent = `${p.entries.length} entries · ${p.subjectIds.length} related subjects`;
  const dashboard = p.cryptoDashboard ? cryptoDashboardHtml(p.cryptoDashboard) : '';
  document.getElementById('projectDetailEntries').innerHTML = dashboard + p.entries.map(e => `
    <div class="entry">
      <h4>${e.title}</h4>
      <div class="entry-date">${formatDate(e.date)}</div>
      <ul>${e.notes.map(n => `<li>${n}</li>`).join('')}</ul>
    </div>
  `).join('');

  // Related subjects
  const relatedSubjects = DATA.subjects.filter(s => p.subjectIds.includes(s.id));
  document.getElementById('projectSubjectsHeader').textContent = `Related Subjects (${relatedSubjects.length})`;
  document.getElementById('projectDetailSubjects').innerHTML = relatedSubjects.length
    ? relatedSubjects.map(s => subjectCard(s)).join('')
    : '<p style="color:var(--text-dim)">No related subjects yet.</p>';

  showPage('project-detail');
}

function cryptoDashboardHtml(d) {
  const p = d.portfolio || {};
  const holdings = d.holdings || [];
  const assets = d.assets || [];
  const m = d.marketRead || {};
  const auto = d.automation || {};
  const holdingTiles = holdings.map(h => `
    <div class="dash-tile">
      <div class="label">${h.asset}</div>
      <div class="value">${fmtAmount(h.amount, h.asset)}</div>
      <div class="small">≈ ${fmtThb(h.valueThb)}</div>
    </div>
  `).join('');
  const rows = assets.map(a => `
    <tr>
      <td><strong>${a.asset}</strong></td>
      <td>${fmtThb(a.livePriceThb)}</td>
      <td>${fmtThb(a.baselinePriceThb)}</td>
      <td>${a.baselineSourceLabel || a.baselineSource || '—'}</td>
      <td class="${numClass(a.moveFromBaselinePct)}">${fmtPct(a.moveFromBaselinePct)}</td>
      <td>${fmtThb(a.volumeThb24h)}</td>
      <td>${fmtPct(a.spreadPct)}</td>
      <td>${fmtPct(a.atrPct)}</td>
      <td>${fmtPct(a.dipTriggerPct)} / ${fmtPct(a.jumpTriggerPct)}</td>
    </tr>
  `).join('');
  const lastTrade = m.lastTrade ? `${m.lastTrade.action} ${m.lastTrade.amount_xrp} @ ${m.lastTrade.price_thb} THB` : '—';
  const last24 = d.last24hrTrades || {};
  const allTrades = [...(last24.trades || [])].sort((a, b) => new Date(b.ts || 0) - new Date(a.ts || 0));
  const last24Trades = filterTrades(allTrades, TRADE_FILTER);
  const filterButtons = [
    ['all', 'All trades'],
    ['open', 'Open Position'],
    ['closed', 'Closed Positions'],
    ['week', 'Trades for Week'],
    ['month', 'Month'],
    ['year', 'Year']
  ].map(([key, label]) => `<button class="back-btn" style="margin:0 6px 6px 0;${TRADE_FILTER === key ? 'border-color:var(--accent);color:var(--accent);' : ''}" onclick="setTradeFilter('${key}')">${label}</button>`).join('');
  const tradeRowId = (t) => t.positionId || [t.ts, t.action, t.amount].join('|');
  const renderTradeRow = (t) => {
    const rid = tradeRowId(t);
    const ov = getTradeOverride(rid);
    const effStatus = ov?.status || t.status || 'Open';
    const effClosed = ov?.priceClosedThb ?? t.priceClosedThb;
    const effExpAction = ov?.expectedAction ?? t.expectedAction;
    const effExpPrice = ov?.expectedPriceThb ?? t.expectedPriceThb;
    const isOpen = String(effStatus).toLowerCase() === 'open';
    const closeBtn = isOpen
      ? `<button class="trade-action-btn close-btn" onclick="event.stopPropagation();setTradeClose('${rid.replace(/'/g,"\\'")}', prompt('Close price (THB)?', '${effExpPrice || ''}'))">✕ Close</button>`
      : (ov?.status === 'CLOSED' ? `<span class="trade-override-reset" onclick="event.stopPropagation();clearTradeOverride('${rid.replace(/'/g,"\\'")}')" title="Revert manual close">↩</span>` : '');
    const editBtn = isOpen
      ? `<button class="trade-action-btn" onclick="event.stopPropagation();editExpectedPrice('${rid.replace(/'/g,"\\'")}')" title="Adjust expected price">✎</button>`
      : '';
    return `
    <tr>
      <td>${t.timeLocal || t.ts || '—'}</td>
      <td><strong>${t.action || '—'}</strong></td>
      <td>${fmtAmount(t.amount, t.asset || '')}</td>
      <td>${fmtThb(t.priceThb)}</td>
      <td>${fmtThb(t.valueThb)}</td>
      <td class="${numClass(t.netEdgePct)}">${fmtPct(t.netEdgePct)}</td>
      <td id="exp-cell-${rid.replace(/[^a-zA-Z0-9_-]/g,'_')}"><div class="trade-edit-row">${effExpAction ? `${effExpAction} ${fmtThb(effExpPrice)}` : fmtThb(effExpPrice)}${editBtn}</div></td>
      <td>${t.plannedExit || t.plan || '—'}</td>
      <td class="${effStatus === 'CLOSED' || effStatus === 'Closed' ? 'neutral' : 'positive'}">${effStatus}${closeBtn ? ' ' + closeBtn : ''}</td>
      <td>${fmtThb(effClosed)}</td>
    </tr>
  `};
  const last24VisibleRows = last24Trades.slice(0, 10).map(renderTradeRow).join('');
  const last24ExtraRows = last24Trades.slice(10).map(renderTradeRow).join('');
  const latestN8n = (auto.n8nRecentExecutions || [])[0];
  return `
    <div class="dashboard">
      <h3>Crypto Executive Dashboard</h3>
      <div class="subtle">Paper-only · Updated ${d.lastUpdatedIso || '—'} · ${d.mode || '—'}</div>

      <div class="dash-grid">
        <div class="dash-tile"><div class="label">Portfolio value</div><div class="value">${fmtThb(p.valueThb)}</div><div class="small">Daily ${fmtPct(p.dailyPnlPct)} · Status ${d.dailyStatus || '—'}</div></div>
        <div class="dash-tile"><div class="label">Vs buy & hold</div><div class="value ${numClass(p.vsHoldThb)}">${fmtSignedThb(p.vsHoldThb)}</div><div class="small">${fmtPct(p.vsHoldPct)}</div></div>
        <div class="dash-tile"><div class="label">Current action</div><div class="value">${d.recommendedAction || d.paperStatus || '—'}</div><div class="small">Last trade: ${lastTrade}</div></div>
        <div class="dash-tile"><div class="label">Automation</div><div class="value">${latestN8n?.status || '—'}</div><div class="small">n8n ${auto.n8nSchedule || '—'} · last checked ${auto.n8nLastCheckedIso || '—'}</div></div>
      </div>

      <h4 style="margin:12px 0 8px;">Current holdings</h4>
      <div class="dash-grid">${holdingTiles}</div>

      <details style="margin:16px 0 12px; border:1px solid var(--border); border-radius:8px; padding:12px; background:rgba(13,17,23,0.35);">
        <summary style="cursor:pointer; font-weight:600;">Baselines, live prices, volume</summary>
        <table class="asset-table" style="margin-top:10px;">
          <thead><tr><th>Asset</th><th>Live</th><th>Baseline</th><th>Baseline source</th><th>Move</th><th>24h volume</th><th>Spread</th><th>ATR</th><th>Dip / Jump triggers</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </details>

      <details style="margin:0 0 12px; border:1px solid var(--border); border-radius:8px; padding:12px; background:rgba(13,17,23,0.35);">
        <summary style="cursor:pointer; font-weight:600;">Signals, sentiment, fee credit</summary>
        <div class="dash-grid" style="margin-top:16px;">
          <div class="dash-tile"><div class="label">Selected signal</div><div class="small">${m.selectedSignal || '—'}</div></div>
          <div class="dash-tile"><div class="label">Scores / Sentiment</div><div class="small">XRP ${m.xrpScore ?? '—'} · ADA ${m.adaScore ?? '—'} · ${m.sentimentRegime || '—'}</div></div>
          <div class="dash-tile"><div class="label">Fee credit</div><div class="small">${fmtThb(p.feeCreditThb)} available · ${m.kubFeeCredit?.status || 'KUB status —'}</div></div>
        </div>
      </details>

      <h4 style="margin:16px 0 8px;">Trade List</h4>
      <div style="margin:0 0 8px;">${filterButtons}</div>
      <div class="subtle">Showing latest 10 matching trades first · ${last24.windowLocal || 'V2 paper ledger'} · ${last24Trades.length}/${allTrades.length} shown · Volume ${fmtThb(last24.totalVolumeThb)} · Net open ADA ${fmtAmount(last24.netAdaAmount, 'ADA')} · Net open XRP ${fmtAmount(last24.netXrpAmount, 'XRP')}</div>
      <div class="subtle">Net edge = estimated move minus fees, spread, and slippage buffer. Positive is useful; negative means the signal probably does not beat trading costs.</div>
      <table class="asset-table">
        <thead><tr><th>Time</th><th>Action</th><th>Amount</th><th>Price</th><th>Value</th><th>Net edge</th><th>Expected Price</th><th>Plan / Exit</th><th>Status</th><th>Price Closed</th></tr></thead>
        <tbody>${last24VisibleRows || '<tr><td colspan="10">No paper trades in the last 24 hours.</td></tr>'}</tbody>
      </table>
      ${last24ExtraRows ? `<details style="margin-top:8px;"><summary>Show older matching trades (${Math.max(last24Trades.length - 10, 0)} more)</summary><table class="asset-table" style="margin-top:8px;"><tbody>${last24ExtraRows}</tbody></table></details>` : ''}

      <ul class="note-list">${(d.executiveNotes || []).map(n => `<li>${n}</li>`).join('')}</ul>
    </div>
  `;
}

function setTradeFilter(filter) {
  TRADE_FILTER = filter;
  showProjectDetail('crypto-paper-trading');
}

// ── Trade overrides (localStorage) ──
function tradeOverrides() {
  try { return JSON.parse(localStorage.getItem('mavisTradeOverrides') || '{}'); }
  catch { return {}; }
}
function saveTradeOverrides(ov) {
  localStorage.setItem('mavisTradeOverrides', JSON.stringify(ov));
}
function getTradeOverride(rowId) {
  return tradeOverrides()[rowId] || null;
}
function setTradeClose(rowId, closePrice) {
  if (!closePrice || isNaN(Number(closePrice))) return;
  const ov = tradeOverrides();
  ov[rowId] = { ...(ov[rowId] || {}), status: 'CLOSED', priceClosedThb: Number(closePrice) };
  saveTradeOverrides(ov);
  showProjectDetail('crypto-paper-trading');
}
function clearTradeOverride(rowId) {
  const ov = tradeOverrides();
  delete ov[rowId];
  saveTradeOverrides(ov);
  showProjectDetail('crypto-paper-trading');
}
function editExpectedPrice(rowId) {
  const ov = tradeOverrides();
  const current = ov[rowId] || {};
  const curPrice = current.expectedPriceThb ?? '';
  const curAction = current.expectedAction || '';
  const newAction = prompt('Expected action (e.g. Sell ≥, Buy ≤, or leave blank):', curAction);
  if (newAction === null) return;
  const newPrice = prompt('Expected price (THB):', String(curPrice));
  if (newPrice === null || isNaN(Number(newPrice)) || !newPrice.trim()) return;
  ov[rowId] = { ...current, expectedAction: newAction.trim() || undefined, expectedPriceThb: Number(newPrice) };
  saveTradeOverrides(ov);
  showProjectDetail('crypto-paper-trading');
}

function filterTrades(trades, filter) {
  const now = new Date();
  const cutoffs = {
    week: new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000),
    month: new Date(now.getTime() - 31 * 24 * 60 * 60 * 1000),
    year: new Date(now.getTime() - 365 * 24 * 60 * 60 * 1000)
  };
  return trades.filter(t => {
    const status = String(t.status || '').toLowerCase();
    if (filter === 'open') return status === 'open';
    if (filter === 'closed') return status === 'closed';
    if (['week', 'month', 'year'].includes(filter)) {
      const ts = new Date(t.ts || 0);
      return !isNaN(ts) && ts >= cutoffs[filter];
    }
    return true;
  });
}

function fmtThb(v) {
  if (v === null || v === undefined || isNaN(Number(v))) return '—';
  return Number(v).toLocaleString(undefined, {maximumFractionDigits: 2}) + ' THB';
}
function fmtSignedThb(v) {
  if (v === null || v === undefined || isNaN(Number(v))) return '—';
  const n = Number(v);
  return (n >= 0 ? '+' : '') + n.toLocaleString(undefined, {maximumFractionDigits: 2}) + ' THB';
}
function fmtPct(v) {
  if (v === null || v === undefined || isNaN(Number(v))) return '—';
  const n = Number(v);
  return (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
}
function fmtAmount(v, asset) {
  if (v === null || v === undefined || isNaN(Number(v))) return '—';
  const digits = ['BTC','ETH'].includes(asset) ? 8 : asset === 'THB' ? 2 : 4;
  return Number(v).toLocaleString(undefined, {maximumFractionDigits: digits}) + ' ' + asset;
}
function numClass(v) {
  if (v === null || v === undefined || isNaN(Number(v))) return 'neutral';
  return Number(v) > 0 ? 'positive' : Number(v) < 0 ? 'negative' : 'neutral';
}

function showSubjectDetail(id) {
  const s = DATA.subjects.find(x => x.id === id);
  if (!s) return;
  document.getElementById('subjectDetailTitle').textContent = s.name;
  document.getElementById('subjectDetailMeta').textContent = `${s.category} · ${s.entries.length} entries`;

  // Link to parent project if any
  if (s.projectId) {
    const p = DATA.projects.find(x => x.id === s.projectId);
    if (p) {
      document.getElementById('subjectDetailProjectLink').innerHTML = `<div class="project-badge" onclick="showProjectDetail('${p.id}')" style="cursor:pointer;">📁 Part of: ${p.name}</div>`;
    }
  } else {
    document.getElementById('subjectDetailProjectLink').innerHTML = '';
  }

  document.getElementById('subjectDetailEntries').innerHTML = s.entries.map(e => `
    <div class="entry">
      <h4>${e.title}</h4>
      <div class="entry-date">${formatDate(e.date)}</div>
      <ul>${e.notes.map(n => `<li>${n}</li>`).join('')}</ul>
    </div>
  `).join('');

  prevPage = 'subjects';
  showPage('subject-detail');
}

function goBackSubject() {
  showPage(prevPage === 'project-detail' ? 'projects' : 'subjects');
}

function showLogDetail(date) {
  const log = DATA.dailyLogs.find(x => x.date === date);
  if (!log) return;
  document.getElementById('logDetailTitle').textContent = `${formatDate(log.date)} — ${log.title}`;
  document.getElementById('logDetailMeta').textContent = log.summary;

  // Project badges
  const projectBadges = (log.projects || []).map(pid => {
    const p = DATA.projects.find(x => x.id === pid);
    return p ? `<span class="project-badge" style="margin-right:8px;cursor:pointer;" onclick="showProjectDetail('${p.id}')">📁 ${p.name}</span>` : '';
  }).join('');
  document.getElementById('logDetailProjects').innerHTML = projectBadges ? `<div style="margin-bottom:16px;">${projectBadges}</div>` : '';

  let html = '';
  log.subjects.forEach(subId => {
    const s = DATA.subjects.find(x => x.id === subId);
    if (!s) return;
    s.entries.filter(e => e.date === log.date).forEach(e => {
      html += `
        <div class="entry">
          <h4>${s.name}: ${e.title}</h4>
          <div class="entry-date">${formatDate(e.date)}</div>
          <ul>${e.notes.map(n => `<li>${n}</li>`).join('')}</ul>
        </div>
      `;
    });
  });

  if (log.highlights.length) {
    html += `
      <div class="entry">
        <h4>Highlights</h4>
        <ul>${log.highlights.map(h => `<li>${h}</li>`).join('')}</ul>
      </div>
    `;
  }

  document.getElementById('logDetailEntries').innerHTML = html || '<p style="color:var(--text-dim)">No detailed entries for this day yet.</p>';
  showPage('log-detail');
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  document.querySelectorAll('header nav a').forEach(a => a.classList.remove('active'));
  const navMap = { 'home': 'home', 'projects': 'projects', 'subjects': 'subjects', 'logs': 'logs' };
  if (navMap[id]) {
    document.querySelector(`header nav a[data-page="${navMap[id]}"]`).classList.add('active');
  }
  window.scrollTo(0, 0);
}

function formatDate(d) {
  const [y, m, day] = d.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[parseInt(m)-1]} ${parseInt(day)}, ${y}`;
}

// Search
document.getElementById('searchBox').addEventListener('input', function() {
  const q = this.value.toLowerCase();
  if (!q) { render(); return; }

  const matchedProjects = getVisibleProjects().filter(p =>
    p.name.toLowerCase().includes(q) || p.summary.toLowerCase().includes(q) || p.tags.some(t => t.includes(q))
  );
  const matchedSubjects = DATA.subjects.filter(s =>
    s.name.toLowerCase().includes(q) || s.summary.toLowerCase().includes(q) || s.tags.some(t => t.includes(q))
  );
  const matchedLogs = DATA.dailyLogs.filter(l =>
    l.title.toLowerCase().includes(q) || l.summary.toLowerCase().includes(q) || l.highlights.some(h => h.toLowerCase().includes(q))
  );

  document.getElementById('homeProjects').innerHTML = matchedProjects.length
    ? matchedProjects.map(p => projectCard(p)).join('')
    : '<p style="color:var(--text-dim)">No matching projects.</p>';
  document.getElementById('allSubjects').innerHTML = matchedSubjects.length
    ? matchedSubjects.map(s => subjectCard(s)).join('')
    : '<p style="color="var(--text-dim)">No matching subjects.</p>';
  document.getElementById('recentLogs').innerHTML = matchedLogs.length
    ? matchedLogs.map(log => logCard(log)).join('')
    : '<p style="color:var(--text-dim)">No matching logs.</p>';

  showPage('home');
});

document.querySelectorAll('header nav a').forEach(a => {
  a.addEventListener('click', function(e) {
    e.preventDefault();
    showPage(this.dataset.page);
  });
});
</script>
